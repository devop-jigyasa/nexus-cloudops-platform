apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus-platform.fullname" . }}-config
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
data:
  APP_NAME: {{ include "nexus-platform.fullname" . }}
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
