apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-redis
  namespace: nexus-cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-redis
  template:
    metadata:
      labels:
        app: nexus-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-redis-service
  namespace: nexus-cloudops
spec:
  type: ClusterIP
  selector:
    app: nexus-redis
  ports:
    - port: 6379
      targetPort: 6379
