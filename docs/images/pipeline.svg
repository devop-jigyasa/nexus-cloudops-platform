<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="releaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="100%" stop-color="#041f18"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pipe-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 0.8px; }
    .pipe-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #94a3b8; letter-spacing: 0.4px; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #38bdf8; letter-spacing: 0.5px; }
    .step-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #cbd5e1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #34d399; }
    .tech-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="1080" height="520" rx="16" fill="url(#pipeBg)"/>
  <rect width="1080" height="520" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header Section -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#2563eb" opacity="0.2"/>
    <rect x="0" y="0" width="135" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="67" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#93c5fd" text-anchor="middle">GITHUB ACTIONS</text>

    <rect x="145" y="0" width="125" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="145" y="0" width="125" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="207" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">STATUS: PASSING</text>

    <text x="0" y="58" class="pipe-title">DEVSECOPS CI/CD AUTOMATED PIPELINE</text>
    <text x="0" y="78" class="pipe-subtitle">AUTOMATED QUALITY, RELIABILITY, SECURITY, CONTAINERIZATION &amp; DECOUPLED DELIVERY</text>
    
    <line x1="0" y1="92" x2="1000" y2="92" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- ROW 1: Trigger + Stage 1, 2, 3, 4 -->

  <!-- Trigger Event Pill -->
  <g transform="translate(40, 140)">
    <rect width="135" height="60" rx="8" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="14" y="24" class="step-num">TRIGGER EVENT</text>
    <text x="14" y="46" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#fff">git push &#x2794; main</text>
  </g>

  <!-- Arrow: Trigger -> Stage 1 -->
  <path d="M 175,170 L 205,170" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="205,170 196,165 196,175" fill="#3b82f6"/>

  <!-- Stage 1: Code Quality -->
  <g transform="translate(205, 120)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="185" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 01</text>
    <rect x="122" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="147" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Code Quality</text>
    <line x1="14" y1="62" x2="171" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">&#x2022; Flake8 Linting</text>
    <text x="14" y="104" class="step-detail">&#x2022; PEP8 Enforcement</text>
    <text x="14" y="124" class="step-detail">&#x2022; Black Formatter</text>
    <text x="14" y="145" class="tech-pill">tool: flake8, black</text>
  </g>

  <!-- Arrow: Stage 1 -> Stage 2 -->
  <path d="M 390,197 L 415,197" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="415,197 407,192 407,202" fill="#10b981"/>

  <!-- Stage 2: Automated Tests -->
  <g transform="translate(415, 120)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="185" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 02</text>
    <rect x="122" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="147" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Automated Tests</text>
    <line x1="14" y1="62" x2="171" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">&#x2022; Pytest Test Suite</text>
    <text x="14" y="104" class="step-detail">&#x2022; Mock Redis Harness</text>
    <text x="14" y="124" class="step-detail">&#x2022; Coverage Telemetry</text>
    <text x="14" y="145" class="tech-pill">tool: pytest, cov</text>
  </g>

  <!-- Arrow: Stage 2 -> Stage 3 -->
  <path d="M 600,197 L 625,197" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="625,197 617,192 617,202" fill="#10b981"/>

  <!-- Stage 3: Trivy DevSecOps (Fixed: No header overlap) -->
  <g transform="translate(625, 120)">
    <rect width="195" height="155" rx="10" fill="url(#cardGrad2)" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#f43f5e" opacity="0.2"/>
    <text x="14" y="21" class="step-num" fill="#fb7185">STAGE 03 &#x2022; SECURITY</text>
    <rect x="132" y="7" width="52" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="158" y="20" class="badge" text-anchor="middle">0 CVE</text>

    <text x="14" y="54" class="step-name">Trivy DevSecOps</text>
    <line x1="14" y1="62" x2="181" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">&#x2022; Filesystem CVE Scan</text>
    <text x="14" y="104" class="step-detail">&#x2022; Secrets Detection</text>
    <text x="14" y="124" class="step-detail">&#x2022; Terraform IaC Audit</text>
    <text x="14" y="145" class="tech-pill" fill="#fb7185">block: CRITICAL/HIGH</text>
  </g>

  <!-- Arrow: Stage 3 -> Stage 4 -->
  <path d="M 820,197 L 845,197" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="845,197 837,192 837,202" fill="#10b981"/>

  <!-- Stage 4: Docker Hardening -->
  <g transform="translate(845, 120)">
    <rect width="195" height="155" rx="10" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 04</text>
    <rect x="132" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="157" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Docker Hardening</text>
    <line x1="14" y1="62" x2="181" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">&#x2022; Multi-Stage Buildx</text>
    <text x="14" y="104" class="step-detail">&#x2022; Non-Root (UID 10001)</text>
    <text x="14" y="124" class="step-detail">&#x2022; Image Trivy Scan Gate</text>
    <text x="14" y="145" class="tech-pill">tool: buildx, trivy</text>
  </g>

  <!-- ROW 2: SLA Callout + Stage 5 + Stage 6 -->

  <!-- Flow Connector from Stage 4 down to Stage 5 -->
  <path d="M 942,275 L 942,310 L 540,310 L 540,335" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5"/>
  <polygon points="540,340 535,330 545,330" fill="#a855f7"/>

  <!-- Left Callout Box: Pipeline SLA -->
  <g transform="translate(40, 340)">
    <rect width="350" height="155" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="28" class="step-name">&#x26A1; Pipeline Performance SLA</text>
    <line x1="18" y1="38" x2="332" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="18" y="62" class="step-detail">&#x2022; Total Execution Time: ~2m 15s</text>
    <text x="18" y="84" class="step-detail">&#x2022; Vulnerability Threshold: 0 CRITICAL / 0 HIGH</text>
    <text x="18" y="106" class="step-detail">&#x2022; Container Footprint: Distroless-style multi-stage</text>
    <text x="18" y="128" class="step-detail">&#x2022; Automated Rollback on Readiness Failure</text>
    <text x="18" y="146" class="tech-pill">governance: enterprise devsecops</text>
  </g>

  <!-- Stage 5: Helm Validation -->
  <g transform="translate(415, 340)">
    <rect width="250" height="155" rx="10" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="250" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 05 &#x2022; PACKAGING</text>
    <rect x="182" y="7" width="54" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="209" y="20" class="badge" text-anchor="middle">VALID</text>

    <text x="14" y="54" class="step-name">&#x2638; Helm Validation</text>
    <line x1="14" y1="62" x2="236" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">&#x2022; helm lint charts/nexus-platform</text>
    <text x="14" y="104" class="step-detail">&#x2022; Dry-run template rendering</text>
    <text x="14" y="124" class="step-detail">&#x2022; K8s Schema &amp; HPA Validation</text>
    <text x="14" y="145" class="tech-pill">k8s schema verified</text>
  </g>

  <!-- Arrow: Stage 5 -> Stage 6 -->
  <path d="M 665,417 L 700,417" stroke="#10b981" stroke-width="3"/>
  <polygon points="700,417 691,412 691,422" fill="#10b981"/>

  <!-- Stage 6: Production Delivery (Fixed: Decoupled Vercel + Render, No Overlaps) -->
  <g transform="translate(700, 340)">
    <rect width="340" height="155" rx="10" fill="url(#releaseGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="32" rx="10" fill="#10b981" opacity="0.25"/>
    <text x="16" y="21" class="step-num" fill="#34d399">STAGE 06 &#x2022; DELIVERY</text>
    <rect x="245" y="7" width="80" height="18" rx="4" fill="#10b981"/>
    <text x="285" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">DEPLOYED</text>

    <text x="16" y="54" class="step-name" fill="#34d399">&#x1F680; Zero-Downtime Release</text>
    <line x1="16" y1="62" x2="324" y2="62" stroke="#047857" stroke-width="1"/>
    <text x="16" y="84" class="step-detail" fill="#d1fae5">&#x2022; Frontend Edge CDN: Vercel (&lt; 50ms)</text>
    <text x="16" y="104" class="step-detail" fill="#d1fae5">&#x2022; Backend Microservice: Render Cloud</text>
    <text x="16" y="124" class="step-detail" fill="#d1fae5">&#x2022; AWS EKS Production Parity (Terraform)</text>
    <text x="16" y="145" class="tech-pill" fill="#6ee7b7">nexus-cloudops-platform-app.vercel.app</text>
  </g>
</svg>
