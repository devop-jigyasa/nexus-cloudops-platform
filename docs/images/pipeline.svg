<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pipe-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 0.8px; }
    .pipe-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94a3b8; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #38bdf8; letter-spacing: 0.5px; }
    .step-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 14px; fill: #cbd5e1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #34d399; }
    .tech-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect width="1080" height="500" rx="16" fill="url(#pipeBg)"/>
  <rect width="1080" height="500" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#2563eb" opacity="0.2"/>
    <rect x="0" y="0" width="135" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="67" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#93c5fd" text-anchor="middle">GITHUB ACTIONS</text>

    <rect x="145" y="0" width="120" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="145" y="0" width="120" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="205" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">STATUS: PASSING</text>

    <text x="0" y="58" class="pipe-title">DEVSECOPS CI/CD AUTOMATED PIPELINE</text>
    <text x="0" y="78" class="pipe-subtitle">AUTOMATED QUALITY, RELIABILITY, SECURITY, CONTAINERIZATION &amp; DELIVERY GATES</text>
    
    <line x1="0" y1="92" x2="1000" y2="92" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Row 1: Trigger + Stage 1, 2, 3, 4 -->
  <!-- Trigger Event Pill -->
  <g transform="translate(40, 145)">
    <rect width="135" height="55" rx="8" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="14" y="24" class="step-num">TRIGGER EVENT</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#fff">git push ➔ main</text>
  </g>

  <!-- Connection Line -->
  <path d="M 175,172 L 205,172" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="205,172 196,167 196,177" fill="#3b82f6"/>

  <!-- Stage 1 -->
  <g transform="translate(205, 115)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="185" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 01</text>
    <rect x="120" y="7" width="52" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="146" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Code Quality</text>
    <line x1="14" y1="62" x2="171" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Flake8 Linting</text>
    <text x="14" y="104" class="step-detail">• PEP8 Enforcement</text>
    <text x="14" y="124" class="step-detail">• Black Formatter</text>
    <text x="14" y="145" class="tech-pill">tool: flake8, black</text>
  </g>

  <!-- Arrow -->
  <path d="M 390,192 L 415,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="415,192 407,187 407,197" fill="#10b981"/>

  <!-- Stage 2 -->
  <g transform="translate(415, 115)">
    <rect width="185" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="185" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 02</text>
    <rect x="120" y="7" width="52" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="146" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Automated Tests</text>
    <line x1="14" y1="62" x2="171" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Pytest Test Suite</text>
    <text x="14" y="104" class="step-detail">• Mock Redis Harness</text>
    <text x="14" y="124" class="step-detail">• Coverage Telemetry</text>
    <text x="14" y="145" class="tech-pill">tool: pytest, cov</text>
  </g>

  <!-- Arrow -->
  <path d="M 600,192 L 625,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="625,192 617,187 617,197" fill="#10b981"/>

  <!-- Stage 3 -->
  <g transform="translate(625, 115)">
    <rect width="195" height="155" rx="10" fill="url(#cardGrad2)" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#f43f5e" opacity="0.2"/>
    <text x="14" y="21" class="step-num" fill="#fb7185">STAGE 03 • SECURITY</text>
    <rect x="130" y="7" width="54" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="157" y="20" class="badge" text-anchor="middle">0 CVE</text>

    <text x="14" y="54" class="step-name">Trivy DevSecOps</text>
    <line x1="14" y1="62" x2="181" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Filesystem CVE Scan</text>
    <text x="14" y="104" class="step-detail">• Secrets Detection</text>
    <text x="14" y="124" class="step-detail">• Terraform IaC Audit</text>
    <text x="14" y="145" class="tech-pill" fill="#fb7185">block: CRITICAL/HIGH</text>
  </g>

  <!-- Arrow -->
  <path d="M 820,192 L 845,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="845,192 837,187 837,197" fill="#10b981"/>

  <!-- Stage 4 -->
  <g transform="translate(845, 115)">
    <rect width="195" height="155" rx="10" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 04</text>
    <rect x="130" y="7" width="54" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="157" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Docker Hardening</text>
    <line x1="14" y1="62" x2="181" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Multi-Stage Buildx</text>
    <text x="14" y="104" class="step-detail">• Non-Root (UID 10001)</text>
    <text x="14" y="124" class="step-detail">• Image Vulnerability Scan</text>
    <text x="14" y="145" class="tech-pill">tool: buildx, trivy</text>
  </g>

  <!-- SECOND ROW: STAGE 5 & 6 (DELIVERY) -->
  <!-- Down Arrow from Stage 4 to Row 2 -->
  <path d="M 942,270 L 942,305 L 635,305 L 635,335" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5"/>
  <polygon points="635,340 630,330 640,330" fill="#a855f7"/>

  <!-- Left Callout Box for CI Metrics -->
  <g transform="translate(40, 340)">
    <rect width="350" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="28" class="step-name">⚡ Pipeline Performance SLA</text>
    <line x1="18" y1="38" x2="332" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="18" y="62" class="step-detail">• Total Execution Time: ~2m 45s</text>
    <text x="18" y="82" class="step-detail">• Vulnerability Threshold: 0 CRITICAL / 0 HIGH</text>
    <text x="18" y="102" class="step-detail">• Image Footprint: Distroless-style multi-stage</text>
    <text x="18" y="122" class="step-detail">• Automated Rollback on Probe Failure</text>
  </g>

  <!-- Stage 5: Helm Validation -->
  <g transform="translate(415, 340)">
    <rect width="250" height="135" rx="10" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="250" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 05 • PACKAGING</text>
    <rect x="185" y="7" width="54" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="212" y="20" class="badge" text-anchor="middle">VALID</text>

    <text x="14" y="54" class="step-name">☸️ Helm Validation</text>
    <line x1="14" y1="62" x2="236" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• helm lint charts/nexus-platform</text>
    <text x="14" y="104" class="step-detail">• Dry-run manifest rendering</text>
    <text x="14" y="124" class="tech-pill">k8s schema verified</text>
  </g>

  <!-- Arrow -->
  <path d="M 665,407 L 700,407" stroke="#10b981" stroke-width="3"/>
  <polygon points="700,407 691,402 691,412" fill="#10b981"/>

  <!-- Stage 6: Deployment Ready -->
  <g transform="translate(700, 340)">
    <rect width="340" height="135" rx="10" fill="#062e24" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="32" rx="10" fill="#10b981" opacity="0.25"/>
    <text x="16" y="21" class="step-num" fill="#34d399">STAGE 06 • PRODUCTION DELIVERY</text>
    <rect x="250" y="7" width="75" height="18" rx="4" fill="#10b981"/>
    <text x="287" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">DEPLOYED</text>

    <text x="16" y="54" class="step-name" fill="#34d399">🚀 Zero-Downtime Release</text>
    <line x1="16" y1="62" x2="324" y2="62" stroke="#047857" stroke-width="1"/>
    <text x="16" y="84" class="step-detail" fill="#d1fae5">• Live Cloud Deployment (Render.com)</text>
    <text x="16" y="104" class="step-detail" fill="#d1fae5">• Production AWS EKS Parity (Terraform)</text>
    <text x="16" y="124" class="tech-pill" fill="#6ee7b7">url: nexus-cloudops-platform.onrender.com</text>
  </g>
</svg>
