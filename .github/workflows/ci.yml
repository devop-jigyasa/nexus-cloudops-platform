name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Lint Code with Flake8
        run: |
          flake8 app/src app/tests --max-line-length=100 --extend-ignore=E203,W503 --statistics

      - name: Check Formatting with Black
        run: |
          black --check app/src app/tests

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest app/tests/ -v --cov=app/src --cov-report=xml --cov-report=term

  security-scan:
    name: DevSecOps Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  docker-build:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: nexus-cloudops-app:test

      - name: Scan Built Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nexus-cloudops-app:test"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  helm-validation:
    name: Helm Chart Lint & Template Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint charts/nexus-platform

      - name: Render Helm Template
        run: |
          helm template test-release charts/nexus-platform
