groups:
  - name: nexus_alerts
    rules:
      - alert: ServiceInstanceDown
        expr: up{job="nexus-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nexus CloudOps App instance is down"
          description: "Instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighHttp5xxErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m]))) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "HTTP 5xx error rate exceeds 5% of total requests over the last 2 minutes."

      - alert: HighHttpLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated p95 HTTP response latency"
          description: "95th percentile latency is above 500ms for over 2 minutes."
