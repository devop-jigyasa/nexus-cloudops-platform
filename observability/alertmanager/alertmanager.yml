global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'platform-notifications'

receivers:
  - name: 'platform-notifications'
    webhook_configs:
      - url: 'http://localhost:5001/'
        send_resolved: true
